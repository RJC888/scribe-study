<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scribe Study – Visualization Demo</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/styles/visualizations.css" />
  <style>
    body {
      padding: 20px;
      background: #f5f5f7;
    }
    #demo-container {
      max-width: 1000px;
      margin: 0 auto;
    }
    .demo-header {
      background: white;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    .demo-header h1 {
      margin-bottom: 8px;
      color: #1e1f22;
    }
    .demo-header p {
      color: #666;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="demo-container">
    <div class="demo-header">
      <h1>🎨 Scribe Study – Visualization System Demo</h1>
      <p>
        Explore different visualization types for Old Testament passages. Each
        visualization can be expanded/collapsed and navigated through a carousel.
      </p>
    </div>

    <div id="visualization-root"></div>
  </div>

  <script type="module">
    import VisualizationDemo from "./visualizations/VisualizationDemo.js";

    const demo = new VisualizationDemo(
      document.getElementById("visualization-root")
    );
    demo.initDemo();
  </script>
</body>
</html>
