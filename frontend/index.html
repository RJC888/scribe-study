<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Scribe Study</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- GOOGLE FONTS: Scripture Display -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Noto+Sans+Hebrew:wght@400;700&family=Noto+Sans+Greek:wght@400;700&display=swap" rel="stylesheet" />

  <!-- MAIN STYLES -->
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/styles/visualizations.css" />
</head>
<body>
  <!-- TOP BAR: APP NAME + SERVER STATUS + ACCOUNT/AUTH PLACEHOLDER -->
  <header id="topBar">
    <div id="appLogo">Scribe Study</div>
    <div id="serverStatusWidget">
      <span id="serverStatusIndicator" class="status-disconnected" title="Checking server...">⚪ Checking...</span>
    </div>
    <div id="userControls">
      <button id="authButton">Sign in / Account</button>
    </div>
  </header>

  <!-- MAIN TABS (Devotional / Academic / Visual / etc.) -->
  <nav id="mainTabs">
    <!-- JS will populate tabs -->
  </nav>

  <!-- MODULE TABS BAR (6 main modules) -->
  <nav id="moduleTabsBar">
    <button class="module-tab" data-module="devotional">Devotional</button>
    <button class="module-tab" data-module="text-analysis">Text Analysis</button>
    <button class="module-tab" data-module="original-languages">Original Languages</button>
    <button class="module-tab" data-module="context">Context</button>
    <button class="module-tab" data-module="jewish-background">Jewish Background</button>
    <button class="module-tab" data-module="teaching">Teaching</button>
  </nav>

  <!-- CONTROL BAR: Navigation -->
  <div id="controlBar">
    <div id="navControls">
      <button id="prevVersionBtn">◀ Prev</button>
      <span id="versionIndexLabel"></span>
      <button id="nextVersionBtn">Next ▶</button>
    </div>
  </div>

  <!-- WELCOME PANEL (PER-TAB INTRO) -->
  <section id="welcomePanel" class="hidden">
    <h2 id="welcomeTitle"></h2>
    <p id="welcomeDescription"></p>
    <ul id="welcomeSubtabList"></ul>
    <label class="welcomeSkip">
      <input type="checkbox" id="skipWelcomeCheckbox" />
      Skip this welcome screen next time
    </label>
    <button id="continueBtn">Continue →</button>
  </section>

  <!-- MAIN SHELL -->
  <main id="mainShell">
    <section id="mainPanel">
      <!-- STANDARD STUDY MODE WORKSPACE (TIER 1 & 3) -->
      <div id="workspace">
        <!-- TOP: SCRIPTURE + ANALYSIS PANELS -->
        <div id="topPanels">
          <!-- SCRIPTURE PANEL -->
          <div id="scripturePanel" class="panel top-panel">
            <div class="panelHeader">
              <span class="panelTitle">Scripture</span>
              <div id="scriptureHeaderControls">
                <button id="languageToggleBtn" style="
                  padding: 6px 12px;
                  background: #3d6df6;
                  color: white;
                  border: none;
                  border-radius: 4px;
                  cursor: pointer;
                  font-size: 12px;
                  font-weight: 600;
                  white-space: nowrap;
                  margin-left: 16px;
                  margin-right: 12px;
                ">🔤 Original Languages</button>
                <select id="versionSelector">
                  <option value="kjv" selected>King James Version</option>
                  <option value="net">NET Bible</option>
                  <option value="net-notes">NET Bible with Notes</option>
                  <option value="asv">American Standard Version</option>
                  <option value="lsv">Literal Standard Version</option>
                  <option value="fbv">Free Bible Version</option>
                  <option value="bsb">Berean Study Bible</option>
                  <option value="t4t">Translation for Translators</option>
                  <option value="emtv">English Majority Text Version</option>
                  <option value="rv">Revised Version 1885</option>
                  <option value="ojps">JPS TaNaKH 1917</option>
                  <option value="engbrent">Brenton Septuagint</option>
                  <option value="tcent">Text-Critical NT</option>
                  <optgroup label="--- Original Languages ---">
                  <option value="hebrew">Hebrew (Original OT)</option>
                  <option value="greek">Koine Greek (Original NT)</option>
                  </optgroup>
                </select>
                <div id="zoomControls">
                  <button id="zoomDecreaseBtn">−</button>
                  <span id="zoomLevel">100%</span>
                  <button id="zoomIncreaseBtn">+</button>
                </div>
              </div>
              <button class="expandBtn" data-target="scripture">⇔</button>
            </div>
            <div id="scriptureContent">
              <!-- PASSAGE INPUT ROW -->
              <div id="passageInputRow">
                <input
                  id="passageInput"
                  type="text"
                  placeholder="Book (Matthew), passage (3:16), topic (grace, mercy), or question (what is grace?)..."
                  autocomplete="off"
                  autocorrect="off"
                  autocapitalize="off"
                  spellcheck="false"
                  data-form-type="other"
                  data-lpignore="true"
                  aria-autocomplete="list"
                  aria-haspopup="listbox"
                  name="bible-passage-search-field"
                />
                <ul id="passageSuggestions" class="autocomplete-dropdown hidden" role="listbox"></ul>
                <div id="topicSuggestionsBar" class="topic-suggestions hidden"></div>
              </div>
              <!-- PINNED PASSAGE BAR -->
              <div id="pinnedPassageBar">
                <span id="pinnedPassageRef">No passage selected</span>
                <button id="helpPageBtn">Help Me Understand...</button>
              </div>
              <!-- SCRIPTURE DISPLAY AREA -->
              <div id="fullPassageText"></div>
            </div>
          </div>

          <!-- ANALYSIS PANEL -->
          <div id="analysisPanel" class="panel top-panel">
            <div class="panelHeader">
              <span class="panelTitle">Analysis / Search Results</span>
              <div id="analysisHeaderControls">
                <button class="analysis-depth-btn active" data-depth="dig-in" title="Concise summary">
                  📝
                </button>
                <button class="analysis-depth-btn" data-depth="deep-dive" title="Thorough deep dive">
                  🔍
                </button>
              </div>
              <button class="expandBtn" data-target="analysis">⇔</button>
            </div>
            <div id="analysisContent">
              <!-- EXISTING IDs TO KEEP CURRENT app.js WORKING -->
              <div id="analysisDisplay"></div>

              <div id="visualizationContainer"></div>
            </div>
          </div>
        </div>

        <!-- BOTTOM: COLLAPSIBLE NOTES BAR + PANEL -->
        <div id="notesBar">
          <button id="expandNotesBtn">Study Notes ↑</button>
        </div>

        <div id="notesPanel" class="panel bottom-panel hidden">
          <div class="panelHeader">
            <span class="panelTitle">Study Notes</span>
            <button id="collapseNotesBtn">↓ Collapse</button>
          </div>
          <div id="notesContent">
            <!-- You can wire this to a textarea, rich editor, etc. -->
            <textarea id="notesTextarea" rows="6" placeholder="Record your study notes here..."></textarea>
          </div>
        </div>

        <!-- VISUALIZATION BUTTON ROW -->
        <div id="visualizationRow">
          <button id="enterVisualizationModeBtn">Open Fullscreen Visualization</button>
        </div>
      </div>

      <!-- TIER 2: FULLSCREEN VISUALIZATION MODE -->
      <section id="visualizationMode" class="hidden">
        <div id="visualizationTopBar">
          <span id="visualizationPassageRef">[Passage for visualization]</span>
          <button id="exitVisualizationBtn">Exit Visualization</button>
        </div>

        <div id="visualizationCanvas">
          <!-- Tier 2 engine renders here in fullscreen -->
        </div>

        <div id="visualizationNav">
          <button id="visualPrevBtn">◀ Prev</button>
          <span id="visualIndexLabel">1 / 1</span>
          <button id="visualNextBtn">Next ▶</button>
        </div>

        <div id="visualNotesBar">
          <!-- Minimal notes hook in Tier 2 (optional future) -->
          <span>Notes available below in Study Mode</span>
        </div>
      </section>

      <!-- HELP MODAL (Full-screen centered modal like subtabModal) -->
      <div id="helpModal" class="hidden">
        <div id="helpModalOverlay"></div>
        <div id="helpModalContent">
          <!-- Header with title, history toggle, and close button -->
          <div id="helpModalHeader">
            <div id="helpModalTitleSection">
              <h2 id="helpModalTitle">Help Me Understand</h2>
            </div>
            <div id="helpModalControls">
              <label id="historyToggleLabel" class="historyToggle">
                <input type="checkbox" id="historyToggleCheckbox" checked />
                <span>Remember my questions</span>
              </label>
              <button id="helpHistoryBtn" class="helpIconBtn">📜 History</button>
              <button id="helpModalCloseBtn">✕</button>
            </div>
          </div>
          
          <!-- Main body: scrollable conversation area + input area -->
          <div id="helpModalBody">
            <!-- Conversation history area -->
            <div id="helpConversationArea">
              <!-- Q&A pairs will be appended here -->
            </div>
          </div>
          
          <!-- Footer: question input and send button -->
          <div id="helpModalFooter">
            <textarea 
              id="helpQuestionInput" 
              rows="2" 
              placeholder="Ask any question about this passage or what you're seeing..."
            ></textarea>
            <button id="helpSendBtn">Send Question →</button>
          </div>
        </div>
      </div>

      <!-- HELP HISTORY MODAL -->
      <div id="helpHistoryModal" class="hidden">
        <div id="helpHistoryModalOverlay"></div>
        <div id="helpHistoryModalContent">
          <div id="helpHistoryModalHeader">
            <h2>Question History</h2>
            <button id="helpHistoryModalCloseBtn">✕</button>
          </div>
          <div id="helpHistoryModalBody">
            <!-- History items will be populated here -->
            <div id="helpHistoryList" class="helpHistoryList">
              <!-- Q&A pairs will be appended here -->
            </div>
          </div>
        </div>
      </div>

      <!-- SUBTAB MODAL (Opens when module tab is clicked) -->
      <div id="subtabModal" class="hidden">
        <div id="subtabModalOverlay"></div>
        <div id="subtabModalContent">
          <div id="subtabModalHeader">
            <h2 id="subtabModalTitle"></h2>
            <button id="subtabModalCloseBtn">✕</button>
          </div>
          <div id="subtabModalBody">
            <div id="subtabGrid" class="subtab-grid">
              <!-- JS will populate subtab cards here -->
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- SERVER STATUS MODAL -->
  <div id="serverStatusModal" class="hidden">
    <div id="serverStatusModalOverlay"></div>
    <div id="serverStatusModalContent">
      <div id="serverStatusModalHeader">
        <h2>Server Status</h2>
        <button id="serverStatusCloseBtn">✕</button>
      </div>
      <div id="serverStatusModalBody">
        <div id="serverStatusDisplay">
          <!-- Status content will be inserted here -->
        </div>
        <div id="serverActionButtons">
          <button id="retryServerBtn" class="btn-primary">🔄 Retry Connection</button>
          <button id="openTerminalBtn" class="btn-secondary">💻 Open Terminal to Start Server</button>
        </div>
        <div id="serverDebugInfo" style="display: none; margin-top: 16px; padding: 12px; background: #f5f5f5; border-radius: 4px; font-family: monospace; font-size: 11px; max-height: 150px; overflow-y: auto; color: #666;">
          <!-- Debug info will be shown here -->
        </div>
      </div>
    </div>
  </div>

  <!-- TODO: Add Firebase scripts here (before app.js) if needed -->

  <!-- MAIN APP SCRIPT (YOUR EXISTING LOGIC) -->
  <script type="module" src="./app.js"></script>
  <!-- UI LAYOUT LOGIC (BOUNDARIES, PANELS, TIER 2) -->
  <script type="module" src="./ui-layout.js"></script>
</body>
</html>
